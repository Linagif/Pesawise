{% extends 'base.html' %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="auth-brand mb-3">Pesa<span>Wise</span></div>
<div class="card"><div class="card-body p-4">
  <h1 class="h4 mb-1">Create your account</h1><p class="text-muted small">Free budgeting for students. Your records are private to you.</p>
  <form method="post" novalidate>{% csrf_token %}{% include 'includes/_form.html' %}
    <button class="btn btn-primary w-100" type="submit">Create account</button></form>
  <p class="small mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div></div>
{% endblock %}
