{% extends 'base.html' %}
{% block title %}Password changed{% endblock %}
{% block content %}
{% if not user.is_authenticated %}<div class="auth-brand mb-3">Pesa<span>Wise</span></div>{% endif %}
<div class="card"><div class="card-body p-4">
  <h1 class="h4 mb-2">Password changed</h1><p class="text-muted">Your password has been reset. You can now log in.</p>
  <a class="btn btn-primary" href="{% url 'login' %}">Log in</a>
</div></div>
{% endblock %}
