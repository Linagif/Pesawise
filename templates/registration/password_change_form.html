{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
{% if not user.is_authenticated %}<div class="auth-brand mb-3">Pesa<span>Wise</span></div>{% endif %}
<div class="card"><div class="card-body p-4">
  <h1 class="h4 mb-2">Change password</h1><p class="text-muted"></p>
  <form method="post">{% csrf_token %}{% include "includes/_form.html" %}<button class="btn btn-primary" type="submit">Change password</button> <a class="btn btn-light" href="{% url 'accounts:profile' %}">Cancel</a></form>
</div></div>
{% endblock %}
