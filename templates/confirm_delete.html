{% extends 'base.html' %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <div class="card border-danger"><div class="card-body">
    <h1 class="h4">Delete {{ object_label }}?</h1>
    <p class="text-muted mb-1">This cannot be undone.</p>
    {% if warning %}<p class="text-muted">{{ warning }}</p>{% endif %}
    <form method="post" class="d-flex gap-2 mt-3">{% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, delete</button>
      <a href="{% url cancel_url %}" class="btn btn-light">Keep it</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
