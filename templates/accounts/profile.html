{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6">
  <h1 class="h3 mb-3">Your profile</h1>
  <div class="card mb-3"><div class="card-body">
    <form method="post" novalidate>{% csrf_token %}{% include 'includes/_form.html' %}
      <button class="btn btn-primary" type="submit">Save profile</button></form>
  </div></div>
  <div class="card"><div class="card-body d-flex justify-content-between align-items-center">
    <div><strong>Password</strong><div class="text-muted small">Username: {{ user.username }}</div></div>
    <a class="btn btn-outline-primary btn-sm" href="{% url 'password_change' %}">Change password</a></div></div>
</div></div>
{% endblock %}
