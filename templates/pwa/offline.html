{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2e24"><title>Offline · PesaWise</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f5f2;color:#17251f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:420px;margin:1rem;padding:2rem;background:#fff;border:1px solid #dde5df;border-radius:12px;text-align:center}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:1.4rem;margin:.75rem 0 .5rem}p{color:#5d6f66;line-height:1.5}
  button{background:#0f6b4f;color:#fff;border:0;border-radius:8px;padding:.7rem 1.4rem;font-size:1rem;font-weight:600;cursor:pointer}
  @media (prefers-color-scheme: dark){
    body{background:#0f1714;color:#e6efe9}main{background:#17211d;border-color:#2a3832}p{color:#9db0a6}
  }
</style></head>
<body><main>
  <img src="{% static 'pwa/icon-192.png' %}" alt="PesaWise">
  <h1>You are offline</h1>
  <p>PesaWise needs an internet connection to show your money records. They are never stored on this device, which keeps them private.</p>
  <p>Check your connection, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main></body></html>
